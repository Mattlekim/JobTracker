<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <!-- Background -->
  <rect width="456" height="456" rx="96" fill="url(#grad)" />

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A3BE6"/>
      <stop offset="100%" stop-color="#3A1FAF"/>
    </linearGradient>
  </defs>

  <!-- W Letter -->
  <path d="M110 120 L150 330 L200 200 L250 330 L300 120"
        stroke="#FFFFFF"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Tracker text -->
  <text x="50%" y="380"
        font-family="Segoe UI, sans-serif"
        font-size="72"
        fill="#FF8800"
        text-anchor="middle"
        font-weight="600">
    Tracker
  </text>
</svg>
