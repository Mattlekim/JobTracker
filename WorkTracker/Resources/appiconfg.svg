<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <!-- Calendar with a tick. Kept inside the central safe zone so Android's
       adaptive-icon mask cannot clip it. The gap between the header band and
       the body is transparent so the background colour draws the divider. -->
  <g fill="#FFFFFF">
    <!-- binder posts -->
    <rect x="153" y="112" width="30" height="70" rx="15"/>
    <rect x="273" y="112" width="30" height="70" rx="15"/>
    <!-- header band (top corners rounded) -->
    <path d="M143 152 h170 a30 30 0 0 1 30 30 v14 h-230 v-14 a30 30 0 0 1 30 -30 z"/>
    <!-- body (bottom corners rounded) -->
    <path d="M113 210 h230 v108 a30 30 0 0 1 -30 30 h-170 a30 30 0 0 1 -30 -30 z"/>
  </g>
  <!-- the tick, in the background green -->
  <path d="M170 272 L214 314 L288 230" fill="none" stroke="#1A9D68" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
