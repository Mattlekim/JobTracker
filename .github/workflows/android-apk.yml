name: Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Pin the build to the .NET 8 SDK so the runner's newer preinstalled
      # SDKs (and their workload versions) are not picked up instead
      - name: Pin .NET SDK version
        run: |
          echo "{ \"sdk\": { \"version\": \"${{ steps.setup-dotnet.outputs.dotnet-version }}\" } }" > global.json
          cat global.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # TargetFrameworks is overridden to android-only because the iOS and
      # MacCatalyst workloads cannot be installed on a Linux runner
      - name: Publish Android APK
        run: >
          dotnet publish WorkTracker/WorkTracker.csproj
          -f net8.0-android
          -c Release
          -p:TargetFrameworks=net8.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidSdkDirectory=$ANDROID_HOME
          -p:JavaSdkDirectory=$JAVA_HOME
          -o artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-android-apk
          path: artifacts/*.apk
          if-no-files-found: error

      # Releases serve assets as direct file downloads (artifacts are
      # always zipped), so main builds also publish the APK as a release
      - name: Prepare release APK
        if: github.ref == 'refs/heads/main'
        run: |
          apk=$(ls artifacts/*-Signed.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then apk=$(ls artifacts/*.apk | head -1); fi
          cp "$apk" WorkTracker.apk
          ls -la WorkTracker.apk

      - name: Publish APK as GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WorkTracker build ${{ github.run_number }}
          make_latest: true
          files: WorkTracker.apk
